<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #00f3ff;
            --secondary-glow: #0066ff;
            --bg-dark: #030813;
            --panel-bg: rgba(6, 18, 36, 0.75);
            --border-glow: rgba(0, 243, 255, 0.3);
            --text-main: #e0f7fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 102, 255, 0.1) 0%, transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .hud-container {
            width: 95%;
            max-width: 900px;
            height: 90vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .hud-header {
            padding: 15px 25px;
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 243, 255, 0.02);
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--primary-glow);
            text-shadow: 0 0 10px var(--primary-glow);
            letter-spacing: 2px;
        }

        .hud-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #00f3ff;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--primary-glow);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-area::-webkit-scrollbar {
            width: 6px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: var(--border-glow);
            border-radius: 3px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 1.05rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(0, 243, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.2);
            color: var(--text-main);
            border-top-left-radius: 0;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.05);
        }

        .message.user {
            align-self: flex-end;
            background: rgba(0, 102, 255, 0.2);
            border: 1px solid rgba(0, 102, 255, 0.4);
            color: #fff;
            border-top-right-radius: 0;
        }

        .input-panel {
            padding: 15px 20px;
            border-top: 1px solid var(--border-glow);
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .input-field {
            flex: 1;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--border-glow);
            padding: 12px 16px;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn {
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid var(--primary-glow);
            color: var(--primary-glow);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:hover {
            background: var(--primary-glow);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .mic-btn {
            padding: 12px 16px;
            border-radius: 50%;
            width: 48px;
            height: 48px;
        }

        .mic-btn.listening {
            background: rgba(255, 0, 85, 0.3);
            border-color: #ff0055;
            color: #ff0055;
            animation: pulse-red 1.2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <div class="hud-header">
            <div class="hud-title">J.A.R.V.I.S.</div>
            <div class="hud-status">
                <div class="status-dot"></div>
                <span id="statusText">ONLINE</span>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message bot">
                Greetings, Boss. Voice systems online. How can I assist you today?
            </div>
        </div>

        <div class="input-panel">
            <button class="btn mic-btn" id="micBtn" title="Voice Input">🎙️</button>
            <input type="text" id="userInput" class="input-field" placeholder="Speak or type a command..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        const API_KEY = "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";
        const MODEL_NAME = "openai/gpt-oss-20b";

        const chatArea = document.getElementById("chatArea");
        const userInput = document.getElementById("userInput");
        const micBtn = document.getElementById("micBtn");
        const statusText = document.getElementById("statusText");

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US'; // Change to 'te-IN' for Telugu speech support

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add("listening");
                statusText.innerText = "LISTENING...";
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove("listening");
                statusText.innerText = "ONLINE";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage();
            };

            recognition.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                isListening = false;
                micBtn.classList.remove("listening");
                statusText.innerText = "ONLINE";
            };

            micBtn.addEventListener("click", () => {
                if (isListening) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });
        } else {
            micBtn.style.display = "none";
            console.warn("Speech Recognition not supported in this browser.");
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage("user", text);
            userInput.value = "";

            statusText.innerText = "PROCESSING...";

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    appendMessage("bot", data.choices[0].message.content);
                } else {
                    appendMessage("bot", "API Error: Unable to fetch response.");
                }
            } catch (err) {
                appendMessage("bot", "Connection Error. Please try again.");
            } finally {
                statusText.innerText = "ONLINE";
            }
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", sender);
            msgDiv.innerText = text;
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
    </script>
</body>
</html>
