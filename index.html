<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI - 100% Free Multi-Modal HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-glow: #00f3ff;
            --orange-glow: #ff7700;
            --orange-dim: rgba(255, 119, 0, 0.2);
            --bg-main: #050a12;
            --card-bg: rgba(10, 20, 32, 0.88);
            --border-cyan: rgba(0, 243, 255, 0.35);
            --border-orange: rgba(255, 119, 0, 0.4);
            --text-color: #e0f7fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 119, 0, 0.08) 0%, transparent 65%),
                radial-gradient(circle at 20% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 119, 0, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 25px 25px, 25px 25px;
        }

        .hud-card {
            width: 95%; max-width: 500px; height: 90vh; max-height: 780px;
            background: var(--card-bg); border: 1.5px solid var(--border-cyan);
            border-radius: 20px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(255, 119, 0, 0.1);
            backdrop-filter: blur(14px); display: flex; position: relative; overflow: hidden;
        }

        .sidebar {
            position: absolute; top: 0; left: -270px; width: 270px; height: 100%;
            background: rgba(5, 12, 22, 0.96); border-right: 1px solid var(--border-orange);
            transition: left 0.3s ease; z-index: 10; display: flex; flex-direction: column; padding: 15px;
            box-shadow: 10px 0 20px rgba(0, 0, 0, 0.5);
        }

        .sidebar.open { left: 0; }

        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid var(--border-orange); padding-bottom: 10px;
        }

        .new-chat-btn {
            background: var(--orange-dim); border: 1px solid var(--orange-glow); color: var(--orange-glow);
            padding: 10px 12px; border-radius: 8px; cursor: pointer; font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem; width: 100%; text-align: center; transition: 0.3s; font-weight: 600;
        }

        .new-chat-btn:hover { background: var(--orange-glow); color: #000; box-shadow: 0 0 12px var(--orange-glow); }

        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }

        .history-item {
            padding: 10px; background: rgba(0, 243, 255, 0.04); border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: 6px; font-size: 0.9rem; cursor: pointer; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; transition: 0.2s;
        }

        .history-item:hover { background: rgba(255, 119, 0, 0.15); border-color: var(--orange-glow); color: #fff; }

        .chat-main { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; }

        .hud-header {
            padding: 15px 20px; border-bottom: 1px solid var(--border-cyan); display: flex;
            justify-content: space-between; align-items: center; background: rgba(0, 243, 255, 0.02);
        }

        .menu-btn { background: transparent; border: none; color: var(--orange-glow); font-size: 1.4rem; cursor: pointer; margin-right: 12px; }

        .hud-title { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 800; color: var(--cyan-glow); letter-spacing: 2px; }

        .hud-status { font-size: 0.75rem; color: var(--orange-glow); display: flex; align-items: center; gap: 6px; font-family: 'Orbitron', sans-serif; }

        .status-dot { width: 7px; height: 7px; background-color: var(--orange-glow); border-radius: 50%; animation: pulse 2s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .chat-feed { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        .msg { max-width: 88%; padding: 11px 15px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }

        .msg.bot { align-self: flex-start; background: rgba(0, 243, 255, 0.08); border: 1px solid rgba(0, 243, 255, 0.3); color: #fff; border-top-left-radius: 2px; }

        .msg.user { align-self: flex-end; background: var(--orange-dim); border: 1px solid var(--border-orange); color: #fff; border-top-right-radius: 2px; }

        .gen-media { width: 100%; max-width: 320px; border-radius: 10px; border: 1px solid var(--cyan-glow); margin-top: 8px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }

        .input-panel { padding: 12px 15px; border-top: 1px solid var(--border-cyan); display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.3); }

        .mic-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(0, 243, 255, 0.1); border: 1px solid var(--cyan-glow); color: var(--cyan-glow); font-size: 1rem; cursor: pointer; }

        .input-field { flex: 1; background: rgba(0, 243, 255, 0.04); border: 1px solid var(--border-cyan); padding: 10px 14px; border-radius: 18px; color: #fff; font-size: 0.9rem; outline: none; }

        .send-btn { background: var(--orange-dim); border: 1px solid var(--orange-glow); color: var(--orange-glow); padding: 8px 16px; border-radius: 16px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: 600; }
    </style>
</head>
<body>

    <div class="hud-card">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span style="font-family:'Orbitron'; font-size:0.9rem; color:var(--orange-glow);">SYSTEM MEMORY</span>
                <button onclick="toggleSidebar()" style="background:none; border:none; color:var(--cyan-glow); font-size:1.2rem; cursor:pointer;">✕</button>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">+ NEW PROTOCOL</button>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="chat-main">
            <div class="hud-header">
                <div style="display:flex; align-items:center;">
                    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                    <div class="hud-title">J.A.R.V.I.S.</div>
                </div>
                <div class="hud-status">
                    <div class="status-dot"></div>
                    <span id="status">ONLINE</span>
                </div>
            </div>

            <div class="chat-feed" id="chatFeed"></div>

            <div class="input-panel">
                <button class="mic-btn" id="micBtn">🎙️</button>
                <input type="text" id="userInput" class="input-field" placeholder="Chat, or generate image/video..." onkeydown="if(event.key==='Enter') sendDirective()">
                <button class="send-btn" onclick="sendDirective()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        const HF_API_KEY = "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";
        const MODEL_NAME = "openai/gpt-oss-20b";

        const chatFeed = document.getElementById("chatFeed");
        const userInput = document.getElementById("userInput");
        const micBtn = document.getElementById("micBtn");
        const statusText = document.getElementById("status");
        const sidebar = document.getElementById("sidebar");
        const historyList = document.getElementById("historyList");

        let sessions = JSON.parse(localStorage.getItem("jarvis_free_sessions")) || [
            { id: 1, title: "Protocol 1.0", messages: [{ role: "assistant", content: "Greetings, Boss. Ask me to chat, generate an image, or create a video!" }] }
        ];
        let currentSessionId = sessions[0].id;

        function toggleSidebar() { sidebar.classList.toggle("open"); renderHistory(); }

        function renderHistory() {
            historyList.innerHTML = "";
            sessions.forEach(session => {
                const div = document.createElement("div");
                div.className = "history-item";
                div.innerText = session.title;
                div.onclick = () => { currentSessionId = session.id; renderChat(); toggleSidebar(); };
                historyList.appendChild(div);
            });
        }

        function startNewChat() {
            const newSession = { id: Date.now(), title: "New Protocol", messages: [{ role: "assistant", content: "Standing by for new directives, Boss." }] };
            sessions.unshift(newSession);
            currentSessionId = newSession.id;
            saveSessions(); renderChat(); toggleSidebar();
        }

        function getCurrentSession() { return sessions.find(s => s.id === currentSessionId) || sessions[0]; }

        function renderChat() {
            chatFeed.innerHTML = "";
            const session = getCurrentSession();
            session.messages.forEach(msg => {
                const div = document.createElement("div");
                div.className = `msg ${msg.role === 'user' ? 'user' : 'bot'}`;
                if (msg.type === "image") {
                    div.innerHTML = `<div>${msg.content}</div><img src="${msg.mediaUrl}" class="gen-media" alt="Generated Image">`;
                } else if (msg.type === "video") {
                    div.innerHTML = `<div>${msg.content}</div><video src="${msg.mediaUrl}" class="gen-media" controls autoplay loop></video>`;
                } else {
                    div.innerText = msg.content;
                }
                chatFeed.appendChild(div);
            });
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        function saveSessions() { localStorage.setItem("jarvis_free_sessions", JSON.stringify(sessions)); }

        // Free Hugging Face Image Generation (FLUX.1-dev)
        async function generateFreeImage(prompt) {
            const response = await fetch("https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-dev", {
                headers: { Authorization: `Bearer ${HF_API_KEY}`, "Content-Type": "application/json" },
                method: "POST",
                body: JSON.stringify({ inputs: `${prompt}, cinematic Marvel visual style, highly detailed, 8k` }),
            });
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        // Free Hugging Face Video Generation
        async function generateFreeVideo(prompt) {
            const response = await fetch("https://api-inference.huggingface.co/models/damo-vilab/text-to-video-ms-1.7b", {
                headers: { Authorization: `Bearer ${HF_API_KEY}`, "Content-Type": "application/json" },
                method: "POST",
                body: JSON.stringify({ inputs: prompt }),
            });
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function sendDirective() {
            const text = userInput.value.trim();
            if (!text) return;

            const session = getCurrentSession();
            session.messages.push({ role: "user", content: text });
            saveSessions(); renderChat();
            userInput.value = "";

            const lowerText = text.toLowerCase();
            const isVideoRequest = lowerText.includes("video") || lowerText.includes("వీడియో");
            const isImageRequest = !isVideoRequest && (lowerText.includes("image") || lowerText.includes("photo") || lowerText.includes("draw") || lowerText.includes("బొమ్మ") || lowerText.includes("generate") || lowerText.includes("create"));

            if (isVideoRequest) {
                statusText.innerText = "GENERATING FREE VIDEO...";
                try {
                    let cleanPrompt = text.replace(/generate|create|a|video|clip|of|వీడియో/gi, "").trim();
                    const videoBlobUrl = await generateFreeVideo(cleanPrompt || text);
                    session.messages.push({ role: "assistant", type: "video", content: "Free video output generated, Boss.", mediaUrl: videoBlobUrl });
                } catch(e) {
                    session.messages.push({ role: "assistant", content: "Video server is busy right now, Boss. Please try again in a moment." });
                }
                saveSessions(); renderChat(); statusText.innerText = "ONLINE";

            } else if (isImageRequest) {
                statusText.innerText = "GENERATING FLUX IMAGE...";
                try {
                    let cleanPrompt = text.replace(/generate|create|an|a|image|photo|picture|of|draw|బొమ్మ/gi, "").trim();
                    const imgBlobUrl = await generateFreeImage(cleanPrompt || text);
                    session.messages.push({ role: "assistant", type: "image", content: "High-fidelity FLUX image generated, Boss.", mediaUrl: imgBlobUrl });
                } catch(e) {
                    session.messages.push({ role: "assistant", content: "Image generation error. Check your Hugging Face API key." });
                }
                saveSessions(); renderChat(); statusText.innerText = "ONLINE";

            } else {
                statusText.innerText = "PROCESSING...";
                try {
                    const apiMessages = session.messages.filter(m => !m.type).map(m => ({ role: m.role, content: m.content }));
                    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ model: MODEL_NAME, messages: apiMessages })
                    });
                    const data = await res.json();
                    if (data.choices && data.choices[0]) {
                        session.messages.push({ role: "assistant", content: data.choices[0].message.content });
                        saveSessions(); renderChat();
                    }
                } catch (err) { console.error(err); }
                finally { statusText.innerText = "ONLINE"; }
            }
        }

        renderChat();
    </script>
</body>
</html>
