<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI - Cyan & Orange HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-glow: #00f3ff;
            --orange-glow: #ff7700;
            --orange-dim: rgba(255, 119, 0, 0.2);
            --bg-main: #050a12;
            --card-bg: rgba(10, 20, 32, 0.88);
            --border-cyan: rgba(0, 243, 255, 0.35);
            --border-orange: rgba(255, 119, 0, 0.4);
            --text-color: #e0f7fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 119, 0, 0.08) 0%, transparent 65%),
                radial-gradient(circle at 20% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 119, 0, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 25px 25px, 25px 25px;
        }

        /* Main HUD Card */
        .hud-card {
            width: 95%;
            max-width: 500px;
            height: 90vh;
            max-height: 780px;
            background: var(--card-bg);
            border: 1.5px solid var(--border-cyan);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(255, 119, 0, 0.1);
            backdrop-filter: blur(14px);
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar for Chat History */
        .sidebar {
            position: absolute;
            top: 0;
            left: -270px;
            width: 270px;
            height: 100%;
            background: rgba(5, 12, 22, 0.96);
            border-right: 1px solid var(--border-orange);
            transition: left 0.3s ease;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: 10px 0 20px rgba(0, 0, 0, 0.5);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-orange);
            padding-bottom: 10px;
        }

        .new-chat-btn {
            background: var(--orange-dim);
            border: 1px solid var(--orange-glow);
            color: var(--orange-glow);
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            width: 100%;
            text-align: center;
            transition: 0.3s;
            font-weight: 600;
        }

        .new-chat-btn:hover {
            background: var(--orange-glow);
            color: #000;
            box-shadow: 0 0 12px var(--orange-glow);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .history-item {
            padding: 10px;
            background: rgba(0, 243, 255, 0.04);
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 119, 0, 0.15);
            border-color: var(--orange-glow);
            color: #fff;
        }

        /* Main Chat Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .hud-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-cyan);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 243, 255, 0.02);
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: var(--orange-glow);
            font-size: 1.4rem;
            cursor: pointer;
            margin-right: 12px;
            transition: 0.2s;
        }

        .menu-btn:hover {
            color: var(--cyan-glow);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--cyan-glow);
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }

        .hud-status {
            font-size: 0.75rem;
            color: var(--orange-glow);
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--orange-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--orange-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .chat-feed {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-feed::-webkit-scrollbar {
            width: 4px;
        }
        .chat-feed::-webkit-scrollbar-thumb {
            background: var(--border-orange);
            border-radius: 4px;
        }

        .msg {
            max-width: 85%;
            padding: 11px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.bot {
            align-self: flex-start;
            background: rgba(0, 243, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: #fff;
            border-top-left-radius: 2px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.05);
        }

        .msg.user {
            align-self: flex-end;
            background: var(--orange-dim);
            border: 1px solid var(--border-orange);
            color: #fff;
            border-top-right-radius: 2px;
            box-shadow: 0 0 10px rgba(255, 119, 0, 0.1);
        }

        .input-panel {
            padding: 12px 15px;
            border-top: 1px solid var(--border-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
        }

        .mic-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyan-glow);
            color: var(--cyan-glow);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .mic-btn:hover {
            background: var(--cyan-glow);
            color: #000;
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .mic-btn.listening {
            border-color: #ff0055;
            color: #ff0055;
            background: rgba(255, 0, 85, 0.2);
            animation: pulse-red 1.2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }

        .input-field {
            flex: 1;
            background: rgba(0, 243, 255, 0.04);
            border: 1px solid var(--border-cyan);
            padding: 10px 14px;
            border-radius: 18px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: var(--orange-glow);
            box-shadow: 0 0 10px rgba(255, 119, 0, 0.25);
        }

        .send-btn {
            background: var(--orange-dim);
            border: 1px solid var(--orange-glow);
            color: var(--orange-glow);
            padding: 8px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .send-btn:hover {
            background: var(--orange-glow);
            color: #000;
            box-shadow: 0 0 12px var(--orange-glow);
        }
    </style>
</head>
<body>

    <div class="hud-card">
        <!-- Sidebar for Chat History -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span style="font-family:'Orbitron'; font-size:0.9rem; color:var(--orange-glow);">SYSTEM MEMORY</span>
                <button onclick="toggleSidebar()" style="background:none; border:none; color:var(--cyan-glow); font-size:1.2rem; cursor:pointer;">✕</button>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">+ NEW PROTOCOL</button>
            <div class="history-list" id="historyList"></div>
        </div>

        <!-- Main Chat Window -->
        <div class="chat-main">
            <div class="hud-header">
                <div class="header-left">
                    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                    <div class="hud-title">J.A.R.V.I.S.</div>
                </div>
                <div class="hud-status">
                    <div class="status-dot"></div>
                    <span id="status">ONLINE</span>
                </div>
            </div>

            <div class="chat-feed" id="chatFeed"></div>

            <div class="input-panel">
                <button class="mic-btn" id="micBtn" title="Voice Input">🎙️</button>
                <input type="text" id="userInput" class="input-field" placeholder="State your directive..." onkeydown="if(event.key==='Enter') sendDirective()">
                <button class="send-btn" onclick="sendDirective()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "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";
        const MODEL_NAME = "openai/gpt-oss-20b";

        const chatFeed = document.getElementById("chatFeed");
        const userInput = document.getElementById("userInput");
        const micBtn = document.getElementById("micBtn");
        const statusText = document.getElementById("status");
        const sidebar = document.getElementById("sidebar");
        const historyList = document.getElementById("historyList");

        let sessions = JSON.parse(localStorage.getItem("jarvis_cyan_orange_sessions")) || [
            { id: 1, title: "Initial Protocol", messages: [{ role: "assistant", content: "Greetings, Boss. All sub-routines operational. How may I assist you?" }] }
        ];
        let currentSessionId = sessions[0].id;

        function toggleSidebar() {
            sidebar.classList.toggle("open");
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = "";
            sessions.forEach(session => {
                const div = document.createElement("div");
                div.className = "history-item";
                div.innerText = session.title;
                div.onclick = () => {
                    currentSessionId = session.id;
                    renderChat();
                    toggleSidebar();
                };
                historyList.appendChild(div);
            });
        }

        function startNewChat() {
            const newSession = {
                id: Date.now(),
                title: "New Protocol",
                messages: [{ role: "assistant", content: "New session initialized, Boss. Standing by for commands." }]
            };
            sessions.unshift(newSession);
            currentSessionId = newSession.id;
            saveSessions();
            renderChat();
            toggleSidebar();
        }

        function getCurrentSession() {
            return sessions.find(s => s.id === currentSessionId) || sessions[0];
        }

        function renderChat() {
            chatFeed.innerHTML = "";
            const session = getCurrentSession();
            session.messages.forEach(msg => {
                const div = document.createElement("div");
                div.className = `msg ${msg.role === 'user' ? 'user' : 'bot'}`;
                div.innerText = msg.content;
                chatFeed.appendChild(div);
            });
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        function saveSessions() {
            localStorage.setItem("jarvis_cyan_orange_sessions", JSON.stringify(sessions));
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => { micBtn.classList.add("listening"); statusText.innerText = "LISTENING..."; };
            recognition.onend = () => { micBtn.classList.remove("listening"); statusText.innerText = "ONLINE"; };
            recognition.onresult = (e) => { userInput.value = e.results[0][0].transcript; sendDirective(); };

            micBtn.onclick = () => {
                if (micBtn.classList.contains("listening")) recognition.stop();
                else recognition.start();
            };
        } else {
            micBtn.style.display = "none";
        }

        async function sendDirective() {
            const text = userInput.value.trim();
            if (!text) return;

            const session = getCurrentSession();
            if (session.messages.length === 1 && session.title === "New Protocol") {
                session.title = text.length > 20 ? text.substring(0, 20) + "..." : text;
            }

            session.messages.push({ role: "user", content: text });
            saveSessions();
            renderChat();

            userInput.value = "";
            statusText.innerText = "PROCESSING...";

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: session.messages
                    })
                });

                const data = await res.json();
                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    session.messages.push({ role: "assistant", content: reply });
                    saveSessions();
                    renderChat();
                    speakText(reply);
                }
            } catch (err) {
                console.error(err);
            } finally {
                statusText.innerText = "ONLINE";
            }
        }

        // Initial Load
        renderChat();
    </script>
</body>
</html>
