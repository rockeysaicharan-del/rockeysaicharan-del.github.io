<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSphere - Online Compiler</title>
    
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Styled Logo Badge instead of broken image */
        .app-logo-badge {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select, button {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #334155;
            color: #f8fafc;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        select:hover {
            background-color: #475569;
        }

        .run-btn {
            background-color: #10b981;
            border-color: #059669;
            font-weight: 600;
        }

        .run-btn:hover {
            background-color: #059669;
        }

        /* Workspace */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
        }

        .pane:last-child {
            border-right: none;
        }

        .pane-header {
            background-color: #1e293b;
            padding: 8px 15px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
        }

        .CodeMirror {
            flex: 1;
            height: auto !important;
            font-size: 14px;
        }

        #output {
            flex: 1;
            background-color: #090d16;
            color: #38bdf8;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .workspace {
                flex-direction: column;
                height: auto;
            }
            .pane {
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo-container">
            <div class="app-logo-badge">&lt;/&gt;</div>
            <h1>CodeSphere</h1>
        </div>
        <div class="controls">
            <select id="language-select">
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="cpp">C++</option>
                <option value="java">Java</option>
            </select>
            <button class="run-btn" id="run-btn">▶ Run Code</button>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Editor -->
        <div class="pane">
            <div class="pane-header">Source Code</div>
            <textarea id="editor-textarea">console.log("Hello CodeSphere!");
let a = 10;
let b = 20;
console.log("Sum:", a + b);</textarea>
        </div>
        
        <!-- Output -->
        <div class="pane">
            <div class="pane-header">Output</div>
            <pre id="output">Click "Run Code" to see output...</pre>
        </div>
    </div>

    <!-- CodeMirror Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

    <script>
        // Editor Setup
        var editor = CodeMirror.fromTextArea(document.getElementById("editor-textarea"), {
            lineNumbers: true,
            theme: "dracula",
            mode: "javascript",
            indentUnit: 4
        });

        // Language Switcher Mode
        document.getElementById("language-select").addEventListener("change", function() {
            let lang = this.value;
            if (lang === "javascript") editor.setOption("mode", "javascript");
            else if (lang === "python") editor.setOption("mode", "python");
            else if (lang === "cpp" || lang === "java") editor.setOption("mode", "text/x-c++src");
        });

        // Execution Logic (Piston API for multi-language + Local fallback for JS)
        document.getElementById("run-btn").addEventListener("click", async function() {
            let code = editor.getValue();
            let language = document.getElementById("language-select").value;
            let outputScreen = document.getElementById("output");
            
            outputScreen.textContent = "Executing code...";

            // If JavaScript, run locally instantly without API
            if (language === "javascript") {
                outputScreen.textContent = "";
                let logs = [];
                let originalConsoleLog = console.log;
                
                console.log = function(...args) {
                    logs.push(args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' '));
                    originalConsoleLog.apply(console, args);
                };

                try {
                    let result = eval(code);
                    if (logs.length > 0) {
                        outputScreen.textContent = logs.join('\n');
                    } else if (result !== undefined) {
                        outputScreen.textContent = result;
                    } else {
                        outputScreen.textContent = "Code executed successfully (No output returned).";
                    }
                } catch (error) {
                    outputScreen.textContent = "Error: " + error.message;
                } finally {
                    console.log = originalConsoleLog;
                }
                return;
            }

            // For other languages (Python, C++, Java), use Piston API
            try {
                let response = await fetch("https://emkc.org/api/v2/piston/execute", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        language: language,
                        version: "*",
                        files: [{ content: code }]
                    })
                });

                let result = await response.json();
                if (result.run) {
                    outputScreen.textContent = result.run.output || result.run.stderr;
                } else {
                    outputScreen.textContent = "Execution failed.";
                }
            } catch (error) {
                outputScreen.textContent = "Error connecting to execution server: " + error.message;
            }
        });
    </script>
</body>
</html>
