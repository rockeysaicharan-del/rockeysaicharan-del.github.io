<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI - Dual Protocol HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-glow: #00f3ff;
            --orange-glow: #ff7700;
            --orange-dim: rgba(255, 119, 0, 0.2);
            --bg-main: #050a12;
            --card-bg: rgba(10, 20, 32, 0.88);
            --border-cyan: rgba(0, 243, 255, 0.35);
            --border-orange: rgba(255, 119, 0, 0.4);
            --text-color: #e0f7fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }

        body {
            background-color: var(--bg-main); color: var(--text-color); height: 100vh;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 119, 0, 0.08) 0%, transparent 65%),
                              radial-gradient(circle at 20% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 50%);
        }

        .hud-card {
            width: 95%; max-width: 500px; height: 90vh; max-height: 780px;
            background: var(--card-bg); border: 1.5px solid var(--border-cyan);
            border-radius: 20px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
            backdrop-filter: blur(14px); display: flex; position: relative; overflow: hidden;
        }

        .chat-main { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; }

        .hud-header {
            padding: 15px 20px; border-bottom: 1px solid var(--border-cyan); display: flex;
            justify-content: space-between; align-items: center; background: rgba(0, 243, 255, 0.02);
        }

        .hud-title { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 800; color: var(--cyan-glow); }
        .hud-status { font-size: 0.75rem; color: var(--orange-glow); font-family: 'Orbitron', sans-serif; }

        .chat-feed { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        .msg { max-width: 88%; padding: 11px 15px; border-radius: 12px; font-size: 0.95rem; }
        .msg.bot { align-self: flex-start; background: rgba(0, 243, 255, 0.08); border: 1px solid rgba(0, 243, 255, 0.3); color: #fff; }
        .msg.user { align-self: flex-end; background: var(--orange-dim); border: 1px solid var(--border-orange); color: #fff; }

        .gen-media { width: 100%; max-width: 320px; border-radius: 10px; border: 1px solid var(--cyan-glow); margin-top: 8px; }

        /* Gemini Pill Input Bar Layout */
        .input-panel { padding: 12px 15px; border-top: 1px solid var(--border-cyan); display: flex; gap: 8px; align-items: center; }

        .gemini-pill {
            display: flex; align-items: center; background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--cyan-glow); border-radius: 30px; padding: 4px 12px; flex: 1; gap: 8px;
        }

        .action-btn { background: none; border: none; color: var(--cyan-glow); font-size: 1.2rem; cursor: pointer; }
        .input-field { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 0.95rem; }

        .mic-btn, .waveform-btn, .send-btn {
            background: none; border: none; color: var(--cyan-glow); font-size: 1.1rem; cursor: pointer;
        }
        .send-btn { color: var(--orange-glow); font-weight: bold; }

        /* Setup Overlay */
        .key-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 10, 18, 0.96); z-index: 100; display: flex;
            flex-direction: column; justify-content: center; align-items: center; padding: 25px;
        }
        .key-modal input {
            width: 100%; padding: 12px; margin: 8px 0; background: rgba(0,243,255,0.05);
            border: 1px solid var(--cyan-glow); color: #fff; border-radius: 8px; font-size: 0.85rem;
        }

        .btn-group { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .btn-primary { background: var(--orange-dim); border: 1px solid var(--orange-glow); color: var(--orange-glow); padding: 12px; border-radius: 10px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.85rem; }
        .btn-secondary { background: rgba(0, 243, 255, 0.1); border: 1px solid var(--cyan-glow); color: var(--cyan-glow); padding: 10px; border-radius: 10px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="hud-card">
        <!-- Key / No-Key Mode Modal -->
        <div class="key-modal" id="keyModal">
            <h3 style="color:var(--cyan-glow); font-family:'Orbitron'; margin-bottom:6px;">J.A.R.V.I.S. CONFIG</h3>
            <p style="font-size:0.8rem; color:#aaa; text-align:center; margin-bottom:12px;">Enter your API keys for Pro Mode, or use Free No-Key Mode.</p>

            <input type="password" id="groqKeyInput" placeholder="Groq API Key (gsk_...) - Optional">
            <input type="password" id="openaiKeyInput" placeholder="OpenAI API Key (sk-...) - Optional">
            
            <div class="btn-group">
                <button class="btn-primary" onclick="saveKeys()">SAVE KEYS (PRO MODE)</button>
                <button class="btn-secondary" onclick="useNoKeyMode()">⚡ CONTINUE WITH NO-KEY MODE</button>
            </div>
        </div>

        <div class="chat-main">
            <div class="hud-header">
                <div class="hud-title">J.A.R.V.I.S.</div>
                <div class="hud-status" id="status">ONLINE</div>
            </div>

            <div class="chat-feed" id="chatFeed"></div>

            <!-- Gemini Input Pill -->
            <div class="input-panel">
                <div class="gemini-pill">
                    <button class="action-btn" title="Add Attachment">+</button>
                    <input type="text" id="userInput" class="input-field" placeholder="Ask J.A.R.V.I.S. or generate image..." onkeydown="if(event.key==='Enter') sendDirective()">
                    <button class="mic-btn" title="Voice Input">🎙️</button>
                    <button class="waveform-btn" title="Live Voice Mode">|||</button>
                </div>
                <button class="send-btn" onclick="sendDirective()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        let GROQ_API_KEY = localStorage.getItem("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") || "";
        let OPENAI_API_KEY = localStorage.getItem("sk-proj-SZgXYwJtIerDU2B0Lrm_-cyvtjJ7c2-LMKfZwDKehf3r9uImXCbCzZ_Ko7KtLoDzL-nVpCszvmQT3BlbkFJrdDR-rVjyNU91hbLlOAU0rYvF3KI1lfEIO1-KaCrMk0s8WmrBZ2DLSglb9Px0y9PqIc-Jk5zwAA") || "";
        let isNoKeyMode = localStorage.getItem("jarvis_nokey_mode") === "true";

        const keyModal = document.getElementById("keyModal");
        const chatFeed = document.getElementById("chatFeed");
        const userInput = document.getElementById("userInput");
        const statusText = document.getElementById("status");

        if ((GROQ_API_KEY && OPENAI_API_KEY) || isNoKeyMode) {
            keyModal.style.display = "none";
        }

        function saveKeys() {
            const gKey = document.getElementById("groqKeyInput").value.trim();
            const oKey = document.getElementById("openaiKeyInput").value.trim();
            if (gKey || oKey) {
                localStorage.setItem("jarvis_groq_key", gKey);
                localStorage.setItem("jarvis_openai_key", oKey);
                localStorage.setItem("jarvis_nokey_mode", "false");
                GROQ_API_KEY = gKey;
                OPENAI_API_KEY = oKey;
                isNoKeyMode = false;
                keyModal.style.display = "none";
            } else {
                alert("Please enter at least one API key, or select No-Key Mode.");
            }
        }

        function useNoKeyMode() {
            localStorage.setItem("jarvis_nokey_mode", "true");
            isNoKeyMode = true;
            keyModal.style.display = "none";
        }

        let messages = [{ role: "assistant", content: "Greetings Boss! Protocols online. How can I assist you today?" }];

        function renderChat() {
            chatFeed.innerHTML = "";
            messages.forEach(msg => {
                const div = document.createElement("div");
                div.className = `msg ${msg.role === 'user' ? 'user' : 'bot'}`;
                if (msg.type === "image") {
                    div.innerHTML = `<div>${msg.content}</div><img src="${msg.mediaUrl}" class="gen-media" alt="Visual Output">`;
                } else {
                    div.innerText = msg.content;
                }
                chatFeed.appendChild(div);
            });
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        // Free Dynamic Image Generation Engine for No-Key Mode
        function generateFreeNoKeyImage(prompt) {
            const cleanPrompt = encodeURIComponent(prompt);
            return `https://pollinations.ai/p/${cleanPrompt}?width=1024&height=1024&seed=${Math.floor(Math.random() * 99999)}`;
        }

        // OpenAI DALL-E 3 API (For Key Mode)
        async function generateDalleImage(prompt) {
            const response = await fetch("https://api.openai.com/v1/images/generations", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${OPENAI_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "dall-e-3",
                    prompt: prompt,
                    n: 1,
                    size: "1024x1024"
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            return data.data[0].url;
        }

        async function sendDirective() {
            const text = userInput.value.trim();
            if (!text) return;

            messages.push({ role: "user", content: text });
            renderChat();
            userInput.value = "";

            const lowerText = text.toLowerCase();
            const isImageRequest = lowerText.includes("image") || lowerText.includes("photo") || lowerText.includes("draw") || lowerText.includes("బొమ్మ") || lowerText.includes("generate") || lowerText.includes("create");

            if (isImageRequest) {
                statusText.innerText = "RENDERING VISUAL...";
                try {
                    let cleanPrompt = text.replace(/generate|create|an|a|image|photo|picture|of|draw|బొమ్మ/gi, "").trim();
                    let imageUrl = "";

                    if (!isNoKeyMode && OPENAI_API_KEY) {
                        imageUrl = await generateDalleImage(cleanPrompt || text);
                    } else {
                        imageUrl = generateFreeNoKeyImage(cleanPrompt || text);
                    }

                    messages.push({ role: "assistant", type: "image", content: "Visual render complete, Boss.", mediaUrl: imageUrl });
                } catch(e) {
                    messages.push({ role: "assistant", content: `Image Generation Error: ${e.message}` });
                }
                renderChat(); statusText.innerText = "ONLINE";

            } else {
                statusText.innerText = "PROCESSING...";
                if (!isNoKeyMode && GROQ_API_KEY) {
                    try {
                        const apiMessages = messages.filter(m => !m.type).map(m => ({ role: m.role, content: m.content }));
                        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                            method: "POST",
                            headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                            body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: apiMessages })
                        });
                        const data = await res.json();
                        if (data.choices && data.choices[0]) {
                            messages.push({ role: "assistant", content: data.choices[0].message.content });
                        }
                    } catch (err) {
                        messages.push({ role: "assistant", content: "Groq Key error. Falling back to basic responses." });
                    }
                } else {
                    // Friendly Jarvis Local Fallback Response in No-Key Mode
                    messages.push({ 
                        role: "assistant", 
                        content: `[NO-KEY MODE] Received: "${text}". Standing by, Boss! Add your Groq API key in config for full GPT-level brain power.` 
                    });
                }
                renderChat(); 
                statusText.innerText = "ONLINE";
            }
        }

        renderChat();
    </script>
</body>
</html>
