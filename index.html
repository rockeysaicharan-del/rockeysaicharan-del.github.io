<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI - Secure Ultra HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-glow: #00f3ff;
            --orange-glow: #ff7700;
            --orange-dim: rgba(255, 119, 0, 0.2);
            --bg-main: #050a12;
            --card-bg: rgba(10, 20, 32, 0.88);
            --border-cyan: rgba(0, 243, 255, 0.35);
            --border-orange: rgba(255, 119, 0, 0.4);
            --text-color: #e0f7fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }

        body {
            background-color: var(--bg-main); color: var(--text-color); height: 100vh;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 119, 0, 0.08) 0%, transparent 65%),
                              radial-gradient(circle at 20% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 50%);
        }

        .hud-card {
            width: 95%; max-width: 500px; height: 90vh; max-height: 780px;
            background: var(--card-bg); border: 1.5px solid var(--border-cyan);
            border-radius: 20px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
            backdrop-filter: blur(14px); display: flex; position: relative; overflow: hidden;
        }

        .chat-main { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; }

        .hud-header {
            padding: 15px 20px; border-bottom: 1px solid var(--border-cyan); display: flex;
            justify-content: space-between; align-items: center; background: rgba(0, 243, 255, 0.02);
        }

        .hud-title { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 800; color: var(--cyan-glow); }
        .hud-status { font-size: 0.75rem; color: var(--orange-glow); font-family: 'Orbitron', sans-serif; }

        .chat-feed { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        .msg { max-width: 88%; padding: 11px 15px; border-radius: 12px; font-size: 0.95rem; }
        .msg.bot { align-self: flex-start; background: rgba(0, 243, 255, 0.08); border: 1px solid rgba(0, 243, 255, 0.3); color: #fff; }
        .msg.user { align-self: flex-end; background: var(--orange-dim); border: 1px solid var(--border-orange); color: #fff; }

        .gen-media { width: 100%; max-width: 320px; border-radius: 10px; border: 1px solid var(--cyan-glow); margin-top: 8px; }

        .input-panel { padding: 12px 15px; border-top: 1px solid var(--border-cyan); display: flex; gap: 8px; }

        .input-field { flex: 1; background: rgba(0, 243, 255, 0.04); border: 1px solid var(--border-cyan); padding: 10px 14px; border-radius: 18px; color: #fff; outline: none; }
        .send-btn { background: var(--orange-dim); border: 1px solid var(--orange-glow); color: var(--orange-glow); padding: 8px 16px; border-radius: 16px; cursor: pointer; font-family: 'Orbitron', sans-serif; }

        /* API Key Modal */
        .key-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 10, 18, 0.96); z-index: 100; display: flex;
            flex-direction: column; justify-content: center; align-items: center; padding: 25px;
        }
        .key-modal input { width: 100%; padding: 12px; margin: 8px 0; background: rgba(0,243,255,0.05); border: 1px solid var(--cyan-glow); color: #fff; border-radius: 8px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="hud-card">
        <!-- Secure Key Modal -->
        <div class="key-modal" id="keyModal">
            <h3 style="color:var(--cyan-glow); font-family:'Orbitron'; margin-bottom:10px;">JARVIS SECURITY PROTOCOL</h3>
            <p style="font-size:0.8rem; color:#aaa; text-align:center; margin-bottom:15px;">Enter your keys once. They are stored locally on your device and will never leak to GitHub.</p>
            <input type="password" id="groqKeyInput" placeholder="Groq API Key (gsk_...)">
            <input type="password" id="hfKeyInput" placeholder="Hugging Face READ Token (hf_...)">
            <button class="send-btn" onclick="saveKeys()" style="width:100%; margin-top:10px; padding:12px;">INITIALIZE JARVIS</button>
        </div>

        <div class="chat-main">
            <div class="hud-header">
                <div class="hud-title">J.A.R.V.I.S.</div>
                <div class="hud-status" id="status">ONLINE</div>
            </div>

            <div class="chat-feed" id="chatFeed"></div>

            <div class="input-panel">
                <input type="text" id="userInput" class="input-field" placeholder="Chat, generate image or video..." onkeydown="if(event.key==='Enter') sendDirective()">
                <button class="send-btn" onclick="sendDirective()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        let GROQ_API_KEY = localStorage.getItem("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") || "";
        let HF_API_KEY = localStorage.getItem("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") || "";

        const keyModal = document.getElementById("keyModal");
        const chatFeed = document.getElementById("chatFeed");
        const userInput = document.getElementById("userInput");
        const statusText = document.getElementById("status");

        if (GROQ_API_KEY && HF_API_KEY) {
            keyModal.style.display = "none";
        }

        function saveKeys() {
            const gKey = document.getElementById("groqKeyInput").value.trim();
            const hKey = document.getElementById("hfKeyInput").value.trim();
            if (gKey && hKey) {
                localStorage.setItem("jarvis_groq_key", gKey);
                localStorage.setItem("jarvis_hf_key", hKey);
                GROQ_API_KEY = gKey;
                HF_API_KEY = hKey;
                keyModal.style.display = "none";
            } else {
                alert("Please enter both API keys!");
            }
        }

        let messages = [{ role: "assistant", content: "System credentials verified. Standing by, Boss!" }];

        function renderChat() {
            chatFeed.innerHTML = "";
            messages.forEach(msg => {
                const div = document.createElement("div");
                div.className = `msg ${msg.role === 'user' ? 'user' : 'bot'}`;
                if (msg.type === "image") {
                    div.innerHTML = `<div>${msg.content}</div><img src="${msg.mediaUrl}" class="gen-media">`;
                } else if (msg.type === "video") {
                    div.innerHTML = `<div>${msg.content}</div><video src="${msg.mediaUrl}" class="gen-media" controls autoplay loop></video>`;
                } else {
                    div.innerText = msg.content;
                }
                chatFeed.appendChild(div);
            });
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        // Reliable Image Generation via SDXL
        async function generateFreeImage(prompt) {
            const response = await fetch("https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0", {
                headers: { 
                    Authorization: `Bearer ${HF_API_KEY}`, 
                    "Content-Type": "application/json" 
                },
                method: "POST",
                body: JSON.stringify({ inputs: `${prompt}, cinematic lighting, highly detailed, 8k resolution, marvel style` }),
            });
            
            if (!response.ok) {
                throw new Error("API Error: " + response.statusText);
            }
            
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        // Fast Video Generation Route
        async function generateFreeVideo(prompt) {
            const cleanPrompt = encodeURIComponent(prompt);
            return `https://pollinations.ai/p/${cleanPrompt}?width=1024&height=576&model=video&seed=${Math.floor(Math.random() * 10000)}`;
        }

        async function sendDirective() {
            const text = userInput.value.trim();
            if (!text) return;

            messages.push({ role: "user", content: text });
            renderChat();
            userInput.value = "";

            const lowerText = text.toLowerCase();
            const isVideoRequest = lowerText.includes("video") || lowerText.includes("వీడియో");
            const isImageRequest = !isVideoRequest && (lowerText.includes("image") || lowerText.includes("photo") || lowerText.includes("draw") || lowerText.includes("బొమ్మ") || lowerText.includes("generate") || lowerText.includes("create"));

            if (isVideoRequest) {
                statusText.innerText = "GENERATING VIDEO...";
                try {
                    let cleanPrompt = text.replace(/generate|create|a|video|clip|of|వీడియో/gi, "").trim();
                    const videoUrl = await generateFreeVideo(cleanPrompt || text);
                    messages.push({ role: "assistant", type: "video", content: "Video rendering completed, Boss.", mediaUrl: videoUrl });
                } catch(e) {
                    messages.push({ role: "assistant", content: "Video server is busy. Please try again." });
                }
                renderChat(); statusText.innerText = "ONLINE";

            } else if (isImageRequest) {
                statusText.innerText = "GENERATING IMAGE...";
                try {
                    let cleanPrompt = text.replace(/generate|create|an|a|image|photo|picture|of|draw|బొమ్మ/gi, "").trim();
                    const imgBlobUrl = await generateFreeImage(cleanPrompt || text);
                    messages.push({ role: "assistant", type: "image", content: "High quality image generated, Boss.", mediaUrl: imgBlobUrl });
                } catch(e) {
                    console.error(e);
                    messages.push({ role: "assistant", content: "Image generation failed. Please verify your Hugging Face READ token." });
                }
                renderChat(); statusText.innerText = "ONLINE";

            } else {
                statusText.innerText = "PROCESSING...";
                try {
                    const apiMessages = messages.filter(m => !m.type).map(m => ({ role: m.role, content: m.content }));
                    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ model: "openai/gpt-oss-20b", messages: apiMessages })
                    });
                    const data = await res.json();
                    if (data.choices && data.choices[0]) {
                        messages.push({ role: "assistant", content: data.choices[0].message.content });
                        renderChat();
                    }
                } catch (err) { console.error(err); }
                finally { statusText.innerText = "ONLINE"; }
            }
        }

        renderChat();
    </script>
</body>
</html>
